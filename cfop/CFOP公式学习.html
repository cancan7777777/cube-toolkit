<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
:root {
  --bg: #0e1116;
  --panel: #161b22;
  --panel2: #1c232c;
  --line: #2a323d;
  --fg: #e6edf3;
  --dim: #8b949e;
  --acc: #58a6ff;
  --ok: #3fb950;
  --warn: #d29922;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  line-height: 1.6;
}
code, .alg { font-family: "SF Mono", Consolas, "Courier New", monospace; }

/* 顶栏 */
header {
  position: sticky; top: 0; z-index: 20;
  background: rgba(14,17,22,.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: 14px 24px;
}
.title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.title h1 { font-size: 19px; font-weight: 650; letter-spacing: .3px; }
.title p { color: var(--dim); font-size: 12.5px; }
.ctrls { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }

.tab, .btn, .vbtn {
  background: var(--panel2); color: var(--fg);
  border: 1px solid var(--line); border-radius: 7px;
  padding: 6px 13px; font-size: 13px; cursor: pointer;
  transition: .15s; font-family: inherit;
}
.tab:hover, .btn:hover, .vbtn:hover { border-color: var(--acc); color: var(--acc); }
.tab.on { background: var(--acc); color: #05121f; border-color: var(--acc); font-weight: 600; }
.vbtn.on { border-color: var(--acc); color: var(--acc); }
.btn.master.on { border-color: var(--ok); color: var(--ok); }
.btn.play { background: #1f3a5f; border-color: #2d5c96; }

input[type=search] {
  background: var(--panel2); border: 1px solid var(--line); border-radius: 7px;
  padding: 6px 12px; color: var(--fg); font-size: 13px; min-width: 220px;
  font-family: inherit;
}
input[type=search]:focus { outline: none; border-color: var(--acc); }
label.chk { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 13px; cursor: pointer; }
#stat { margin-left: auto; color: var(--dim); font-size: 12.5px; font-family: "SF Mono", Consolas, monospace; }

/* 说明条 */

  padding: 10px 24px; background: var(--panel);
  border-bottom: 1px solid var(--line);
  font-size: 12.5px; color: var(--dim);
}

.legend .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin: 0 3px 0 10px; vertical-align: -1px; }

/* 分组 */
main { padding: 20px 24px 60px; }
.group { margin-bottom: 30px; }
.group h2 {
  font-size: 13px; color: var(--dim); font-weight: 600;
  letter-spacing: 1.4px; text-transform: uppercase;
  margin-bottom: 12px; display: flex; align-items: center; gap: 9px;
}

}

}

/* 卡片 */
.card {

}

.cube-svg { display: block; }
.st { stroke: #0b0e12; stroke-width: .7; }
.stepbadge {
  position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
  background: var(--acc); color: #05121f; font-size: 11.5px; font-weight: 600;
  padding: 2px 9px; border-radius: 11px; font-family: "SF Mono", Consolas, monospace;
  white-space: nowrap;
}
.info { flex: 1; min-width: 0; }
.head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.id {
  background: var(--acc); color: #05121f; font-size: 11px; font-weight: 700;
  padding: 1px 7px; border-radius: 4px;
  font-family: "SF Mono", Consolas, monospace;
}
.nm { font-size: 14.5px; font-weight: 600; }
.tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.tag {
  background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
  font-size: 10.5px; padding: 1px 7px; border-radius: 4px;
}

.alg {
  background: #0b0e12; border: 1px solid var(--line); border-radius: 6px;

}

.acts { display: flex; gap: 6px; }
.acts .btn { padding: 4px 11px; font-size: 12px; }

.empty { color: var(--dim); text-align: center; padding: 60px 0; }

/* 练习模式 */
#practice { padding: 26px 24px 60px; text-align: center; }
#pTitle { font-size: 15px; color: var(--dim); margin-bottom: 16px; }
#pCube { display: inline-block; margin-bottom: 18px; }
#pChoices { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; max-width: 900px; margin: 0 auto 20px; }
.btn.choice { font-size: 12.5px; padding: 5px 12px; }
.btn.choice.wrong { border-color: #d14343; color: #d14343; }

/* 3D 快照图 */
.cube-box img { display: block; width: 190px; height: 190px; }

/* 3D 查看器浮层 */
.viewer {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(4,7,11,.84);
  display: flex; align-items: center; justify-content: center;
}
.viewer-panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px 18px; text-align: center; max-width: 94vw;
  box-shadow: 0 18px 60px rgba(0,0,0,.5);
}
.viewer-title { font-size: 15px; font-weight: 600; margin-bottom: 2px; text-align: left; }
.viewer-alg {
  background: #0b0e12; border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 10px; font-size: 12.5px; color: var(--dim); text-align: left;
  font-family: "SF Mono", Consolas, monospace; margin: 6px 0 10px;
  max-width: 430px; word-break: break-all; user-select: all;
}
.viewer-stage {
  width: min(400px, 84vw); height: min(380px, 58vh); margin: 0 auto;
  touch-action: none; cursor: grab;
}
.viewer-stage:active { cursor: grabbing; }
.viewer-ctrls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
.viewer-hint { color: #55627a; font-size: 11px; margin-top: 8px; }

/* 练习模式 3D */
#pCube { display: inline-block; margin-bottom: 6px; touch-action: none; cursor: grab; }
#pCtrls { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }

<body>

<header>
  <div class="title">
    <h1>CFOP 三层公式速查</h1>
    <p>PLL 21 · OLL 57 · F2L 41 · 桥式 45 &nbsp;|&nbsp; 每张图都由公式逆推生成，图与公式严格一致</p>
  </div>
  <div class="ctrls">
    <button class="tab on" data-tab="pll">PLL</button>
    <button class="tab" data-tab="oll">OLL</button>

    <span style="width:14px"></span>

    <span class="vbtn-group" style="display:flex;gap:5px">

<div class="legend">
  <b>读图：</b>可见 U（上）· F（前）· R（右）三个面 &nbsp;
  <span class="sw" style="background:#F5D327"></span>U
  <span class="sw" style="background:#12A150"></span>F
  <span class="sw" style="background:#D22630"></span>R
  <span class="sw" style="background:#F2F2F2;border:1px solid #555"></span>D
  <span class="sw" style="background:#F07E13"></span>L
  <span class="sw" style="background:#1B4E9B"></span>B
  　<b>视角：</b>黄面为 U 层，F2L 请以白面为底（D）；OLL/PLL 从 U 面观察。
</div>

<main id="main"></main>

<section id="practice" hidden>
  <div id="pTitle"></div>
  <div id="pCube"></div>
  <div id="pCtrls" hidden>
    <button class="btn play" id="pPlay">▶ 演示公式</button>
    <button class="btn" id="pReset">↺ 复位</button>

  <button class="btn" id="reveal">看答案</button>

</section>

<script>
/* =========================================================
   三阶魔方引擎 —— 纯前端，无依赖
   1) 状态模型：54 个贴纸，用「原始法向量」记录颜色来源
   2) 转动：支持 U D L R F B / M E S / r l u d f b / x y z，含 ' 与 2
   3) 渲染：等轴测投影出 U / F / R 三面 SVG
   4) 反推：由公式逆推「该公式对应的打乱状态」，保证图 formula 一致
   ========================================================= */

/* ---------- 面定义 ---------- */
const FACES = {
  U: { n: [0, 1, 0], r: [1, 0, 0], u: [0, 0, -1], color: '#F5D327', name: 'U' },
  R: { n: [1, 0, 0], r: [0, 0, -1], u: [0, 1, 0], color: '#D22630', name: 'R' },
  F: { n: [0, 0, 1], r: [1, 0, 0], u: [0, 1, 0], color: '#12A150', name: 'F' },
  D: { n: [0, -1, 0], r: [1, 0, 0], u: [0, 0, 1], color: '#F2F2F2', name: 'D' },
  L: { n: [-1, 0, 0], r: [0, 0, 1], u: [0, 1, 0], color: '#F07E13', name: 'L' },
  B: { n: [0, 0, -1], r: [-1, 0, 0], u: [0, 1, 0], color: '#1B4E9B', name: 'B' },
};
const FACE_ORDER = ['U', 'R', 'F', 'D', 'L', 'B'];

/* ---------- 54 个贴纸的坐标 ---------- */
const STICKERS = [];
const STICKER_INDEX = {};   // "Ux,y,z|nx,ny,nz" -> index
let _si = 0;
for (const f of FACE_ORDER) {
  const { n, r, u } = FACES[f];
  for (let row = -1; row <= 1; row++) {
    for (let col = -1; col <= 1; col++) {
      const p = [
        n[0] + r[0] * col + u[0] * row,
        n[1] + r[1] * col + u[1] * row,
        n[2] + r[2] * col + u[2] * row,
      ];
      STICKERS.push({ p, n: n.slice() });
      STICKER_INDEX[`${p[0]},${p[1]},${p[2]}|${n[0]},${n[1]},${n[2]}`] = _si;
      _si++;
    }
  }
}

/* ---------- 向量 / 旋转 ---------- */
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

/** 绕主轴旋转 90°（右手定则）。sign=+1 为 +90° */
function rot90(v, axis, sign) {
  const [x, y, z] = v;
  let o;
  if (axis === 'x') o = sign > 0 ? [x, -z, y] : [x, z, -y];
  else if (axis === 'y') o = sign > 0 ? [z, y, -x] : [-z, y, x];
  else o = sign > 0 ? [-y, x, z] : [y, -x, z];
  return o;
}

/* ---------- 转动表 ----------
   每项： { axis, keep(p)->bool, sign }
   sign = 绕正主轴旋转的圈数方向（+90° 为 1）
------------------------------------------------- */
// 面转顺时针 = 绕该面外法向 -90°
const MOVES = {
  U: { axis: 'y', test: (p) => p[1] === 1, sign: -1 },
  D: { axis: 'y', test: (p) => p[1] === -1, sign: 1 },
  R: { axis: 'x', test: (p) => p[0] === 1, sign: -1 },
  L: { axis: 'x', test: (p) => p[0] === -1, sign: 1 },
  F: { axis: 'z', test: (p) => p[2] === 1, sign: -1 },
  B: { axis: 'z', test: (p) => p[2] === -1, sign: 1 },
  // 夹层：M 同 L 方向，E 同 D 方向，S 同 F 方向
  M: { axis: 'x', test: (p) => p[0] === 0, sign: 1 },
  E: { axis: 'y', test: (p) => p[1] === 0, sign: 1 },
  S: { axis: 'z', test: (p) => p[2] === 0, sign: -1 },
  // 宽层
  r: { axis: 'x', test: (p) => p[0] >= 0, sign: -1 },
  l: { axis: 'x', test: (p) => p[0] <= 0, sign: 1 },
  u: { axis: 'y', test: (p) => p[1] >= 0, sign: -1 },
  d: { axis: 'y', test: (p) => p[1] <= 0, sign: 1 },
  f: { axis: 'z', test: (p) => p[2] >= 0, sign: -1 },
  b: { axis: 'z', test: (p) => p[2] <= 0, sign: 1 },
  // 双层 D（Dw = D E）
  Dw: { axis: 'y', test: (p) => p[1] <= 0, sign: 1 },
  // 整体转
  x: { axis: 'x', test: () => true, sign: -1 },
  y: { axis: 'y', test: () => true, sign: -1 },
  z: { axis: 'z', test: () => true, sign: -1 },
};

/* ---------- 状态 ---------- */
/** state[i] = 该位置贴纸的「原始法向量」，即颜色来源 */
function solvedState() {
  return STICKERS.map((s) => s.n.slice());
}
function cloneState(st) { return st.map((v) => v.slice()); }

/** 预计算：每个转动的 贴纸->目标位置 映射 */
const MOVE_MAP = {};
for (const key of Object.keys(MOVES)) {
  const mv = MOVES[key];
  const map = new Array(54);
  for (let i = 0; i < 54; i++) {
    const { p, n } = STICKERS[i];
    if (!mv.test(p)) { map[i] = -1; continue; }
    const np = rot90(p, mv.axis, mv.sign);
    const nn = rot90(n, mv.axis, mv.sign);
    map[i] = STICKER_INDEX[`${np[0]},${np[1]},${np[2]}|${nn[0]},${nn[1]},${nn[2]}`];
  }
  MOVE_MAP[key] = map;
}

function applyMove(state, key) {
  const base = key.replace(/['2]/g, '');
  const map = MOVE_MAP[base];
  if (!map) throw new Error('未知转动: ' + key);
  let times = 1;
  if (key.endsWith('2')) times = 2;
  else if (key.endsWith("'")) times = 3;
  let st = state;
  for (let t = 0; t < times; t++) {
    // 先原样保留未参与该层转动的贴纸，再写入转动后的贴纸
    const out = st.slice();
    for (let i = 0; i < 54; i++) {
      const j = map[i];
      if (j >= 0) out[j] = st[i];
    }
    st = out;
  }
  return st;
}

/* ---------- 公式解析 ----------
   支持：空格 / 无空格紧凑写法 / 括号重复 (abc)n / R2' / R'' /
        中文括号与标点 / 全角撇号
------------------------------------------------------------ */
const TURN_LETTERS = 'UDLRFBMESudlrfbxyz';

/** 括号重复展开：(inner)n -> inner inner ... */
function expandParens(s) {
  let guard = 0;
  while (s.indexOf('(') !== -1 && guard++ < 20) {
    const i = s.indexOf('(');
    const j = s.indexOf(')', i);
    if (j === -1) throw new Error('括号不匹配: ' + s);
    const inner = s.slice(i + 1, j);
    let k = j + 1, num = '';
    while (k < s.length && s[k] >= '0' && s[k] <= '9') { num += s[k]; k++; }
    const n = num === '' ? 1 : parseInt(num, 10);
    s = s.slice(0, i) + (inner.trim() + ' ').repeat(n).trim() + s.slice(k);
  }
  if (s.indexOf('(') !== -1 || s.indexOf(')') !== -1) throw new Error('括号不匹配: ' + s);
  return s;
}

/** 扫描解析：字母 + 可选数字 + 可选撇号（可重复） */
const PRIME = String.fromCharCode(39);

function tokenize(s) {
  const toks = [];
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === ' ' || ch === '\t') continue;
    if (TURN_LETTERS.indexOf(ch) === -1) {
      throw new Error('无法解析字符 "' + ch + '"（位置 ' + i + '）于: ' + s);
    }
    // 兼容 M2' / M'2 / M2'2 三种书写顺序
    let num = '', primes = 0;
    for (let k = 0; k < 2; k++) {
      while (i + 1 < s.length && s[i + 1] >= '0' && s[i + 1] <= '9') { num += s[++i]; }
      while (i + 1 < s.length && s[i + 1] === PRIME) { primes++; i++; }
    }
    let t = ch;
    if (num !== '' && num !== '1') t += num;
    if (primes > 0) {
      // M'2 == M2（转 2 次后再逆 1 次 = 转 1 次的逆）；M'' == M2
      if (num === '2') t = ch;else if (primes >= 2) t = ch + '2';
      else if (num === '3') t = ch + PRIME;
      else t += PRIME;
    }
    toks.push(t);
  }
  return toks;
}

function parseAlg(str) {
  let s = String(str)
    .replace(/[\uFF08\uFF09\u3010\u3011]/g, '()')
    .replace(/[\uFF0C\u3001\uFF1B]/g, ' ')
    .replace(/[\u2018\u2019\u02BC]/g, PRIME)
    .replace(/\s+/g, ' ')
    .trim();
  s = expandParens(s);
  const toks = tokenize(s);
  for (let i = 0; i < toks.length; i++) {
    if (!MOVES[toks[i].split(PRIME).join('').split('2').join('')]) {
      throw new Error('未知转动: ' + toks[i]);
    }
  }
  return toks;
}

function applyAlg(state, alg) {
  let st = cloneState(state);
  for (const t of parseAlg(alg)) st = applyMove(st, t);
  return st;
}

function invertAlg(alg) {
  return parseAlg(alg)
    .slice()
    .reverse()
    .map((t) => {
      const base = t.replace(/['2]/g, '');
      if (t.endsWith('2')) return base + '2';
      if (t.endsWith("'")) return base;
      return base + "'";
    })
    .join(' ');
}

/** 公式对应的「打乱状态」：把公式的逆操作作用在还原状态上 */
function caseFromAlg(alg) {
  return applyAlg(solvedState(), invertAlg(alg));
}

/* ---------- 校验用：读取块位置 ---------- */
const CORNER_POS = [
  [0, 1, 0], [1, 1, 0], [0, 1, 0], [1, 1, 0],   // 占位，下面重建
];
// 用「贴纸集合」定义 8 角 12 棱
const CORNER_DEFS = [
  { pos: [1, 1, 1], faces: ['U', 'R', 'F'] },
  { pos: [-1, 1, 1], faces: ['U', 'F', 'L'] },
  { pos: [-1, 1, -1], faces: ['U', 'L', 'B'] },
  { pos: [1, 1, -1], faces: ['U', 'B', 'R'] },
  { pos: [1, -1, 1], faces: ['D', 'F', 'R'] },
  { pos: [-1, -1, 1], faces: ['D', 'L', 'F'] },
  { pos: [-1, -1, -1], faces: ['D', 'B', 'L'] },
  { pos: [1, -1, -1], faces: ['D', 'R', 'B'] },
];
const EDGE_DEFS = [
  { pos: [1, 1, 0], faces: ['U', 'R'] },
  { pos: [0, 1, 1], faces: ['U', 'F'] },
  { pos: [-1, 1, 0], faces: ['U', 'L'] },
  { pos: [0, 1, -1], faces: ['U', 'B'] },
  { pos: [1, -1, 0], faces: ['D', 'R'] },
  { pos: [0, -1, 1], faces: ['D', 'F'] },
  { pos: [-1, -1, 0], faces: ['D', 'L'] },
  { pos: [0, -1, -1], faces: ['D', 'B'] },
  { pos: [1, 0, 1], faces: ['R', 'F'] },
  { pos: [-1, 0, 1], faces: ['L', 'F'] },
  { pos: [-1, 0, -1], faces: ['L', 'B'] },
  { pos: [1, 0, -1], faces: ['R', 'B'] },
];

function faceletIndexAt(pos, face) {
  const F = FACES[face];
  const rel = [pos[0] - F.n[0], pos[1] - F.n[1], pos[2] - F.n[2]];
  const col = dot(rel, F.r), row = dot(rel, F.u);
  return STICKER_INDEX[`${pos[0]},${pos[1]},${pos[2]}|${F.n[0]},${F.n[1]},${F.n[2]}`] !== undefined
    ? STICKER_INDEX[`${pos[0]},${pos[1]},${pos[2]}|${F.n[0]},${F.n[1]},${F.n[2]}`]
    : -1;
}

/* ---------- 校验工具 ----------
   块的「身份」= 该块三个/两个面的颜色集合（排序后的面名字符串）。
   从某个槽位读出颜色集合，就能唯一确定是哪一块，从而得到真实置换。
------------------------------------------------------------ */

/** 读出某个块位置 pos 上、属于面 f 的贴纸所显示的颜色（面名） */
function colorAt(state, pos, f) {
  const N = FACES[f].n;
  const i = STICKER_INDEX[pos[0] + ',' + pos[1] + ',' + pos[2] + '|' + N[0] + ',' + N[1] + ',' + N[2]];
  if (i === undefined) return null;
  const c = state[i];
  for (const name of FACE_ORDER) {
    const M = FACES[name].n;
    if (c[0] === M[0] && c[1] === M[1] && c[2] === M[2]) return name;
  }
  return null;
}

/** 槽位 -> 落在该槽位的块身份字符串 */
function slotIdentity(state, def) {
  return def.faces.map((f) => colorAt(state, def.pos, f)).sort().join('');
}
/** 定义的块 -> 它本来应是什么身份 */
function defIdentity(def) {
  return def.faces.slice().sort().join('');
}

/** 该槽位是否完全归位（位置对 + 朝向对） */
function slotSolved(state, def) {
  return def.faces.every((f, k) => colorAt(state, def.pos, f) === f);
}

/** 真实置换：pieceSlot[i] = 第 i 块当前所在的槽位下标；-1 表示该块丢失 */
function pieceSlots(state) {
  const cornerSlot = CORNER_DEFS.map((def) => {
    const id = defIdentity(def);
    for (let j = 0; j < CORNER_DEFS.length; j++) {
      if (slotIdentity(state, CORNER_DEFS[j]) === id) return j;
    }
    return -1;
  });
  const edgeSlot = EDGE_DEFS.map((def) => {
    const id = defIdentity(def);
    for (let j = 0; j < EDGE_DEFS.length; j++) {
      if (slotIdentity(state, EDGE_DEFS[j]) === id) return j;
    }
    return -1;
  });
  return { cornerSlot, edgeSlot };
}

/** 校验用状态快照 */
function pieceStatus(state) {
  return {
    corners: CORNER_DEFS.map((d) => ({ pos: d.pos, solved: slotSolved(state, d) })),
    edges: EDGE_DEFS.map((d) => ({ pos: d.pos, solved: slotSolved(state, d) })),
  };
}

/**
 * F2L 是否完好：D 层四角 + 十字四棱 + 中层四棱 全部原位
 * （即「除顶层外全部完成」，OLL / PLL 的前提）
 */
function f2lSolved(state) {
  let bad = 0;
  for (const d of CORNER_DEFS) if (d.pos[1] === -1 && !slotSolved(state, d)) bad++;
  for (const d of EDGE_DEFS) if (d.pos[1] === -1 && !slotSolved(state, d)) bad++;   // 十字
  for (const d of EDGE_DEFS) if (d.pos[1] === 0 && !slotSolved(state, d)) bad++;    // 中层
  return bad === 0;
}

/**
 * 合法的 F2L / 桥式 case：只允许「最后一对角棱」被打散。
 *  - D 层十字必须完好
 *  - D 层角块最多错 1 个（目标槽角）
 *  - 中层棱最多错 1 个（目标槽棱）
 *  - 顶层 4 角 4 棱 可自由错位（那是 U 层，不影响判定）
 */
function f2lCaseValid(state) {
  let badCorner = 0, badMidEdge = 0, badCross = 0;
  for (const d of CORNER_DEFS) if (d.pos[1] === -1 && !slotSolved(state, d)) badCorner++;
  for (const d of EDGE_DEFS) {
    if (d.pos[1] === -1 && !slotSolved(state, d)) badCross++;
    if (d.pos[1] === 0 && !slotSolved(state, d)) badMidEdge++;
  }
  return {
    ok: badCross === 0 && badCorner <= 1 && badMidEdge <= 1,
    badCorner, badMidEdge, badCross,
  };
}

/** U 面是否同色（OLL 完成后 / PLL 的前提） */
function uFaceUniform(state) {
  for (let r = -1; r <= 1; r++) {
    for (let c = -1; c <= 1; c++) {
      if (colorAt(state, [c, 1, -r], 'U') !== 'U') return false;
    }
  }
  return true;
}

/** 置换奇偶性：真实魔方的角、棱置换必须都是偶置换 */
function permutationParity(state) {
  const { cornerSlot, edgeSlot } = pieceSlots(state);
  const parity = (perm) => {
    for (let i = 0; i < perm.length; i++) if (perm[i] < 0) return null;   // 有块丢失
    const a = perm.slice();
    let swaps = 0;
    for (let i = 0; i < a.length; i++) {
      while (a[i] !== i) { const t = a[a[i]]; a[a[i]] = a[i]; a[i] = t; swaps++; }
    }
    return swaps % 2 === 0 ? 0 : 1;
  };
  return { corner: parity(cornerSlot), edge: parity(edgeSlot), cornerSlot, edgeSlot };
}

/** 整体旋转（x/y/z），用于把 case 归一化到标准视角 */
function rotateWhole(state, key) { return applyMove(state, key); }
const Y_ROTATIONS = ['y', "y'", 'y2'];

/* ---------- 渲染 ---------- */
const ISO = (p) => [(p[0] - p[2]) * 0.8660, (p[0] + p[2]) * 0.5 - p[1]];

function colorOfNormal(nn) {
  for (const f of FACE_ORDER) {
    const N = FACES[f].n;
    if (nn[0] === N[0] && nn[1] === N[1] && nn[2] === N[2]) return FACES[f].color;
  }
  return '#888';
}
function faceNameOfNormal(nn) {
  for (const f of FACE_ORDER) {
    const N = FACES[f].n;
    if (nn[0] === N[0] && nn[1] === N[1] && nn[2] === N[2]) return f;
  }
  return '?';
}

const VISIBLE = ['U', 'F', 'R'];

/**
 * 渲染等轴测 SVG
 * @param state 魔方状态
 * @param opts { size, gap, showFaceLabels, highlight:{corners:[],edges:[]}, dimOthers }
 */
function renderCubeSVG(state, opts = {}) {
  const size = opts.size || 180;
  const gap = opts.gap === undefined ? 0.07 : opts.gap;
  const pad = 10;
  const VIS = opts.faces || ['U', 'F', 'R'];

  /* 每个可见贴纸：直接用 STICKERS 里存好的真实 3D 位置，
     再向面内偏移半个贴纸宽度，得到四个角点的 3D 坐标。 */
  const items = [];
  for (let i = 0; i < 54; i++) {
    const st = STICKERS[i];
    const f = faceNameOfNormal(st.n);
    if (VIS.indexOf(f) === -1) continue;
    const F = FACES[f];
    // 面内基向量（单位化后即贴纸的边方向）
    const Rv = F.r, Uv = F.u;
    const half = 0.5 * (1 - gap);
    const corners = [];
    for (const [dc, dr] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      const c3 = [
        st.p[0] + Rv[0] * dc * half + Uv[0] * dr * half,
        st.p[1] + Rv[1] * dc * half + Uv[1] * dr * half,
        st.p[2] + Rv[2] * dc * half + Uv[2] * dr * half,
      ];
      corners.push(ISO(c3));
    }
    items.push({ f, pts: corners, color: colorOfNormal(state[i]), pos: st.p });
  }

  // 投影包围盒
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const it of items) {
    for (const [x, y] of it.pts) {
      minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    }
  }
  const w = maxX - minX, h = maxY - minY;
  const scale = (size - pad * 2) / Math.max(w, h);
  const ox = pad + (size - pad * 2 - w * scale) / 2 - minX * scale;
  const oy = pad + (size - pad * 2 - h * scale) / 2 - minY * scale;

  // 画家算法：按深度 (x+y+z) 从远到近
  const depth = (p) => p[0] + p[1] + p[2];
  const draw = items.slice().sort((a, b) => depth(b.pos) - depth(a.pos));

  let body = '';
  for (const it of draw) {
    const pts = it.pts.map(([x, y]) => `${(x * scale + ox).toFixed(2)},${(y * scale + oy).toFixed(2)}`).join(' ');
    body += `<polygon points="${pts}" fill="${it.color}" class="st st-${it.f}" data-f="${it.f}"/>`;
  }

  let labels = '';
  if (opts.showFaceLabels) {
    const lab = { U: [0, 2.05, 0], F: [0, -1.9, 0], R: [1.9, 0, 0], D: [0, -1.9, 0], L: [-1.9, 0, 0], B: [0, 0, -1.9] };
    for (const f of VIS) {
      const p = lab[f];
      if (!p) continue;
      const [sx, sy] = ISO(p);
      labels += `<text x="${(sx * scale + ox).toFixed(1)}" y="${(sy * scale + oy).toFixed(1)}" class="flabel" text-anchor="middle" dominant-baseline="central">${f}</text>`;
    }
  }

  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg" class="cube-svg">
<g class="sticks">${body}</g>${labels}</svg>`;
}

/* =========================================================
   CFOP 三层 + 桥式扩展 · 交互学习网页
   所有 case 图由公式逆推生成，与公式严格一致
   ========================================================= */

/* ---------- 全局状态 ---------- */
let currentTab = 'pll';

/** 读取「已掌握」列表：数据损坏 / 非数组 / 存储不可用都不能让整页脚本挂掉 */
function loadMastered() {
  try {
    const v = JSON.parse(localStorage.getItem('cfop_mastered') || '[]');
    return Array.isArray(v) ? v.filter((x) => typeof x === 'string') : [];
  } catch (e) {
    return [];
  }
}

let mastered = new Set(loadMastered());
let practiceMode = false;
let practiceQueue = [];
let practiceIdx = 0;
let practiceScore = 0;
let practiceCurrentRecorded = false;

const PRACTICE_STATS_KEY = 'cfop_stats_v1';

function loadPracticeStats() {
  try {
    const raw = JSON.parse(localStorage.getItem(PRACTICE_STATS_KEY) || '{}');
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return {};
    const out = {};
    for (const [key, value] of Object.entries(raw)) {
      if (!/^(pll|oll|f2l|bridge):/.test(key) || !value || typeof value !== 'object') continue;
      const attempts = Math.max(0, Math.floor(Number(value.attempts) || 0));
      const correct = Math.min(attempts, Math.max(0, Math.floor(Number(value.correct) || 0)));
      if (attempts) out[key] = { attempts, correct };
    }
    return out;
  } catch (e) {
    return {};
  }
}

function savePracticeStats() {
  try { localStorage.setItem(PRACTICE_STATS_KEY, JSON.stringify(practiceStats)); } catch (e) { /* 忽略 */ }
}

let practiceStats = loadPracticeStats();

function practiceRate(stats) {
  return stats && stats.attempts ? Math.round(stats.correct / stats.attempts * 100) : null;
}

function practiceWeight(item, kind) {
  const stats = practiceStats[kind + ':' + item.id];
  if (!stats || !stats.attempts) return 3;
  const wrong = stats.attempts - stats.correct;
  return 1 + wrong * 3 + (stats.correct === 0 ? 1 : 0) + Math.max(0, 5 - stats.attempts) * 0.2;
}

function buildPracticeQueue(src, kind) {
  // 先随机打散，再按弱项权重排序；每个 case 在一轮中只出现一次。
  return src.slice()
    .sort(() => Math.random() - 0.5)
    .sort((a, b) => practiceWeight(b, kind) - practiceWeight(a, kind));
}

/* ---------- 视角控制 ---------- */
const VIEW = { rot: '' };   // '', 'y', "y'", 'y2'

function rotateIfNeeded(state) {
  return VIEW.rot ? applyMove(state, VIEW.rot) : state;
}

/* ---------- 渲染一个 case ---------- */
function renderCase(item, kind) {
  const wrap = document.createElement('div');
  wrap.className = 'card';

  const key = kind + ':' + item.id;
  const isMastered = mastered.has(key);

  // 图片区
  const figWrap = document.createElement('div');
  figWrap.className = 'fig';
  const box = document.createElement('div');
  box.className = 'cube-box';
  const st = caseFromAlg(item.alg);
  if (CUBE3D_OK) {
    // 3D 快照图（离屏 WebGL 渲染一次，卡片零开销）
    box.classList.add('snap');
    box.title = '点击查看可拖转的 3D 演示';
    const img = document.createElement('img');
    img.alt = item.id;
    box.appendChild(img);
    SNAP_QUEUE.push(rotateIfNeeded(st), (url) => { if (url) img.src = url; else box.classList.remove('snap'); });
    box.onclick = () => openViewer(item);
  } else {
    box.innerHTML = renderCubeSVG(rotateIfNeeded(st), { size: 190 });
  }
  figWrap.appendChild(box);
  wrap.appendChild(figWrap);

  // 文字区
  const info = document.createElement('div');
  info.className = 'info';

  const head = document.createElement('div');
  head.className = 'head';
  head.innerHTML = `<span class="id">${item.id}</span><span class="nm">${item.name}</span>`;
  info.appendChild(head);

  const tags = document.createElement('div');
  tags.className = 'tags';
  const ps = practiceStats[key];
  const rate = practiceRate(ps);
  const weak = ps && ps.attempts && rate < 70;
  tags.innerHTML = `<span class="tag">${item.grp}</span>` +
    (item.frag ? '<span class="tag warn">手法片段 · 需接续</span>' : '') +
    `<span class="tag moves">${parseAlg(item.alg).length} 步</span>` +
    `<span class="tag${weak ? ' weak' : ''}">练习 ${ps ? ps.attempts : 0}${rate != null ? ' · ' + rate + '%' : ''}</span>`;
  info.appendChild(tags);

  const alg = document.createElement('div');
  alg.className = 'alg';
  alg.textContent = parseAlg(item.alg).join(' ');
  info.appendChild(alg);

  if (item.note) {
    const note = document.createElement('div');
    note.className = 'note';
    note.textContent = item.note;
    info.appendChild(note);
  }

  const acts = document.createElement('div');
  acts.className = 'acts';
  const btnPlay = document.createElement('button');
  btnPlay.className = 'btn play';
  btnPlay.textContent = '演示';
  btnPlay.onclick = () => CUBE3D_OK ? openViewer(item, true) : animate(item, box);
  const btnStep = document.createElement('button');
  btnStep.className = 'btn';
  btnStep.textContent = '单步';
  btnStep.onclick = () => CUBE3D_OK ? openViewer(item, false, true) : stepOnce(item, box);
  const btnM = document.createElement('button');
  btnM.className = 'btn master' + (isMastered ? ' on' : '');
  btnM.textContent = isMastered ? '已掌握' : '标记';
  btnM.onclick = () => {
    const k = kind + ':' + item.id;
    if (mastered.has(k)) { mastered.delete(k); btnM.textContent = '标记'; btnM.classList.remove('on'); }
    else { mastered.add(k); btnM.textContent = '已掌握'; btnM.classList.add('on'); }
    localStorage.setItem('cfop_mastered', JSON.stringify([...mastered]));
    updateStat();
  };
  acts.appendChild(btnPlay);
  acts.appendChild(btnStep);
  acts.appendChild(btnM);
  info.appendChild(acts);

  wrap.appendChild(info);
  return wrap;
}

/* ---------- 动画 ---------- */
function animate(item, box) {
  const toks = parseAlg(item.alg);
  let st = caseFromAlg(item.alg);
  if (VIEW.rot) st = rotateIfNeeded(st);
  let i = 0;
  box.innerHTML = renderCubeSVG(st, { size: 190 });
  const badge = document.createElement('div');
  badge.className = 'stepbadge';
  box.appendChild(badge);
  const timer = setInterval(() => {
    if (i >= toks.length) {
      clearInterval(timer);
      badge.textContent = '完成 ✓';
      setTimeout(() => { if (badge.parentNode) badge.parentNode.removeChild(badge); }, 900);
      return;
    }
    st = applyMove(st, toks[i]);
    box.innerHTML = renderCubeSVG(st, { size: 190 });
    const b = document.createElement('div');
    b.className = 'stepbadge';
    b.textContent = toks[i] + '  (' + (i + 1) + '/' + toks.length + ')';
    box.appendChild(b);
    i++;
  }, 620);
}

function stepOnce(item, box) {
  const toks = parseAlg(item.alg);
  let st = box._st || (box._st = rotateIfNeeded(caseFromAlg(item.alg)));
  box._i = box._i || 0;
  if (box._i >= toks.length) { box._i = 0; box._st = rotateIfNeeded(caseFromAlg(item.alg)); st = box._st; }
  st = applyMove(st, toks[box._i]);
  box._st = st; box._i++;
  box.innerHTML = renderCubeSVG(st, { size: 190 });
  const b = document.createElement('div');
  b.className = 'stepbadge';
  b.textContent = toks[box._i - 1] + '  (' + box._i + '/' + toks.length + ')';
  box.appendChild(b);
}

/* ---------- 分组与筛选 ---------- */
function groupsOf(kind) {
  const src = { f2l: f2l, oll: oll, pll: pll, bridge: bridge }[kind];
  const m = new Map();
  for (const it of src) {
    if (!m.has(it.grp)) m.set(it.grp, []);
    m.get(it.grp).push(it);
  }
  return m;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  const q = document.getElementById('search').value.trim().toLowerCase();
  const onlyTodo = document.getElementById('onlyTodo').checked;

  for (const [grp, items] of groupsOf(currentTab)) {
    const list = items.filter((it) => {
      if (q && !(it.name.toLowerCase().includes(q) || String(it.id).toLowerCase().includes(q) || it.alg.toLowerCase().includes(q))) return false;
      if (onlyTodo && mastered.has(currentTab + ':' + it.id)) return false;
      return true;
    });
    if (!list.length) continue;

    const sec = document.createElement('section');
    sec.className = 'group';
    const h = document.createElement('h2');
    h.innerHTML = `<span>${grp}</span><em>${list.length}</em>`;
    sec.appendChild(h);
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const it of list) grid.appendChild(renderCase(it, currentTab));
    sec.appendChild(grid);
    main.appendChild(sec);
  }
  if (!main.children.length) {
    main.innerHTML = '<div class="empty">没有匹配的条目</div>';
  }
  updateStat();
}

function updateStat() {
  const src = { f2l: f2l, oll: oll, pll: pll, bridge: bridge }[currentTab];
  const n = src.filter((it) => mastered.has(currentTab + ':' + it.id)).length;
  document.getElementById('stat').textContent = `${currentTab.toUpperCase()} ${n}/${src.length} 已掌握`;
}

function startPractice() {
  practiceMode = true;
  const src = { f2l: f2l, oll: oll, pll: pll, bridge: bridge }[currentTab];
  practiceQueue = src.filter((it) => !mastered.has(currentTab + ':' + it.id));
  if (!practiceQueue.length) practiceQueue = src.slice();
  practiceQueue = buildPracticeQueue(practiceQueue, currentTab);
  practiceIdx = 0;
  practiceScore = 0;
  practiceCurrentRecorded = false;
  document.getElementById('practice').hidden = false;
  document.getElementById('main').hidden = true;
  drawPractice();
}

function drawPractice() {
  const box = document.getElementById('pCube');
  const it = practiceQueue[practiceIdx];
  practiceCurrentRecorded = false;
  if (CUBE3D_OK) {
    practiceCubeEnsure().setState(rotateIfNeeded(caseFromAlg(it.alg)));
    document.getElementById('pCtrls').hidden = false;
  } else {
    box.innerHTML = renderCubeSVG(rotateIfNeeded(caseFromAlg(it.alg)), { size: 260 });
  }
  document.getElementById('pTitle').textContent = `第 ${practiceIdx + 1} / ${practiceQueue.length} 题 · 正确 ${practiceScore}`;
  const choices = { pll: ['Ua','Ub','H','Z','Aa','Ab','E','T','Ja','Jb','Ra','Rb','F','Ga','Gb','Gc','Gd','V','Y','Na','Nb'],
                    oll: oll.map((o) => o.name), f2l: f2l.map((o) => o.name),
                    bridge: bridge.map((o) => o.name) }[currentTab];
  const wrap = document.getElementById('pChoices');
  wrap.innerHTML = '';
  choices.forEach((c) => {
    const b = document.createElement('button');
    b.className = 'btn choice';
    b.textContent = c;
    b.onclick = () => {
      // PLL 的选项用的是 id（Ua / H / Z …），其他页用的是 name，
      // 两边都要能判对，否则 PLL 练习点了正确答案也不会前进
      const correct = c === it.id || c === it.name;
      if (!practiceCurrentRecorded) {
        practiceCurrentRecorded = true;
        const key = currentTab + ':' + it.id;
        const stats = practiceStats[key] || { attempts: 0, correct: 0 };
        stats.attempts++;
        if (correct) stats.correct++;
        practiceStats[key] = stats;
        savePracticeStats();
        if (correct) practiceScore++;
      }
      if (correct) nextPractice();
      else { b.classList.add('wrong'); setTimeout(() => b.classList.remove('wrong'), 400); }
    };
    wrap.appendChild(b);
  });
}

function nextPractice() {
  practiceIdx++;
  if (practiceIdx >= practiceQueue.length) {
    const weakCount = practiceQueue.filter((it) => {
      const stats = practiceStats[currentTab + ':' + it.id];
      return stats && stats.attempts && stats.correct / stats.attempts < 0.7;
    }).length;
    const rate = practiceQueue.length ? Math.round(practiceScore / practiceQueue.length * 100) : 0;
    document.getElementById('pTitle').textContent =
      `完成！共 ${practiceQueue.length} 题，正确 ${practiceScore}（${rate}%）· 弱项 ${weakCount} 个`;
    document.getElementById('pCube').innerHTML = '';
    document.getElementById('pChoices').innerHTML = '';
    document.getElementById('pCtrls').hidden = true;
    if (practiceCube) { practiceCube.dispose(); practiceCube = null; }
    return;
  }
  drawPractice();
}

function exitPractice() {
  practiceMode = false;
  document.getElementById('practice').hidden = true;
  document.getElementById('main').hidden = false;
  if (practiceCube) { practiceCube.dispose(); practiceCube = null; }
  document.getElementById('pCtrls').hidden = true;
}

/* ---------- 事件绑定 ---------- */
function init() {
  document.querySelectorAll('.tab').forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll('.tab').forEach((x) => x.classList.remove('on'));
      b.classList.add('on');
      currentTab = b.dataset.tab;
      render();
    };
  });
  document.getElementById('search').oninput = render;
  document.getElementById('onlyTodo').onchange = render;
  document.getElementById('practiceBtn').onclick = startPractice;
  document.getElementById('exitPractice').onclick = exitPractice;
  document.getElementById('reveal').onclick = () => {
    const it = practiceQueue[practiceIdx];
    if (!it) return;          // 练习已结束 / 尚未开始：此处没有当前题，避免报错
    alert(`${it.id} ${it.name}\n${parseAlg(it.alg).join(' ')}`);
  };
  document.querySelectorAll('.vbtn').forEach((b) => {
    b.onclick = () => {
      VIEW.rot = b.dataset.rot;
      document.querySelectorAll('.vbtn').forEach((x) => x.classList.remove('on'));
      b.classList.add('on');
      render();
    };
  });
  render();
}

document.addEventListener('DOMContentLoaded', init);

</script>

<!-- ============ 3D 可视化（Three.js，本地离线库） ============ -->
<script src="three.global.js"></script>
<script>
/* =========================================================
   3D 渲染模块
   1) SNAP3D：离屏渲染每个 case 的 3D 快照图（卡片用，零常驻开销）
   2) Cube3D：可拖转、可播放层转动动画的交互 3D（查看器/练习模式用）
   状态模型与上方引擎同源（54 贴纸），保证图与公式严格一致
   ========================================================= */
const CUBE3D_OK = (() => {
  if (typeof THREE === 'undefined') return false;
  try {
    const c = document.createElement('canvas');
    return !!(c.getContext('webgl2') || c.getContext('webgl') || c.getContext('experimental-webgl'));
  } catch (e) { return false; }
})();

const CUBE_NORMALS = { U: [0,1,0], D: [0,-1,0], F: [0,0,1], B: [0,0,-1], R: [1,0,0], L: [-1,0,0] };

/** 通用：搭 27 个 cubie（黑塑料底 + 彩色贴纸面片），返回 cubie 数组 */
function buildCubies(cubeGroup) {
  const plastic = new THREE.MeshStandardMaterial({ color: 0x12141a, roughness: 0.55, metalness: 0.15 });
  const boxGeo = new THREE.BoxGeometry(0.96, 0.96, 0.96);
  const stickerGeo = new THREE.PlaneGeometry(0.82, 0.82);
  const cubies = [];
  for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 1; z++) {
    const mesh = new THREE.Mesh(boxGeo, plastic);
    mesh.position.set(x, y, z);
    for (const f of FACE_ORDER) {
      const n = CUBE_NORMALS[f];
      const on = (n[0] && n[0] === x) || (n[1] && n[1] === y) || (n[2] && n[2] === z);
      if (!on) continue;
      const p = new THREE.Mesh(stickerGeo, new THREE.MeshStandardMaterial({
        color: new THREE.Color(FACES[f].color), roughness: 0.28, metalness: 0.05,
      }));
      p.position.set(n[0] * 0.485, n[1] * 0.485, n[2] * 0.485);
      // 贴纸 +z 轴严格对齐面法向（lookAt 用世界坐标会倾斜角/棱块上的贴纸）
      p.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), new THREE.Vector3(n[0], n[1], n[2]));
      p.userData.localN = n.slice();     // cubie 本地坐标中的贴纸法向
      mesh.add(p);
    }
    cubeGroup.add(mesh);
    cubies.push({ mesh });
  }
  return cubies;
}

/** 通用：按 54 贴纸状态给 cubie 贴纸染色 */
const _paintV = typeof THREE !== 'undefined' ? new THREE.Vector3() : null;
function paintCubies(cubies, state) {
  for (const { mesh } of cubies) {
    const p = mesh.position;
    const posKey = Math.round(p.x) + ',' + Math.round(p.y) + ',' + Math.round(p.z);
    for (const child of mesh.children) {
      // 贴纸世界法向 = 本地法向随 cubie 朝向旋转（朝向恒为 90° 的整数倍，可直接取整）
      _paintV.fromArray(child.userData.localN).applyQuaternion(mesh.quaternion);
      const nKey = Math.round(_paintV.x) + ',' + Math.round(_paintV.y) + ',' + Math.round(_paintV.z);
      const idx = STICKER_INDEX[posKey + '|' + nKey];
      if (idx === undefined) continue;
      child.material.color.set(colorOfNormal(state[idx]));
    }
  }
}

function addStdLights(scene) {
  scene.add(new THREE.HemisphereLight(0xffffff, 0x223044, 1.05));
  const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(5, 8, 6); scene.add(key);
  const fill = new THREE.DirectionalLight(0x88aaff, 0.5); fill.position.set(-6, -3, -4); scene.add(fill);
}

/* ---------- 快照渲染器（单例，按需创建） ---------- */
const SNAP3D = (() => {
  if (!CUBE3D_OK) return () => null;
  let r = null, scene, camera, cubies, ok = null;
  function ensure(px) {
    if (ok !== null) return ok;
    try {
      r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      r.setPixelRatio(1);
      r.setSize(px, px);
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
      camera.position.set(4.2, 4.2, 6.4);
      camera.lookAt(0, 0, 0);
      addStdLights(scene);
      const g = new THREE.Group(); scene.add(g);
      cubies = buildCubies(g);
      ok = true;
    } catch (e) { ok = false; }
    return ok;
  }
  return (state, px) => {
    if (!ensure(px * 2)) return null;   // 2x 分辨率保证清晰
    paintCubies(cubies, state);
    r.render(scene, camera);
    return r.domElement.toDataURL('image/png');
  };
})();

/* ---------- 快照任务队列（逐张渲染，不阻塞页面） ---------- */
const SNAP_QUEUE = {
  jobs: [], busy: false,
  push(state, cb) { this.jobs.push([state, cb]); this.drain(); },
  drain() {
    if (this.busy) return;
    this.busy = true;
    const stepFn = () => {
      if (!this.jobs.length) { this.busy = false; return; }
      const [st, cb] = this.jobs.shift();
      cb(SNAP3D(st, 190));
      setTimeout(stepFn, 0);
    };
    setTimeout(stepFn, 0);
  },
};

/* ---------- 交互 3D 魔方 ---------- */
class Cube3D {
  constructor(container, opts = {}) {
    this.size = opts.size || 300;
    this.speed = opts.speed || 260;
    const w = container.clientWidth || this.size;
    const h = container.clientHeight || this.size;
    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    this.renderer.setSize(w, h);
    container.appendChild(this.renderer.domElement);

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(38, w / h, 0.1, 100);
    this.camera.position.set(4.2, 4.2, 6.4);
    this.camera.lookAt(0, 0, 0);
    addStdLights(this.scene);

    this.wrap = new THREE.Group(); this.scene.add(this.wrap);
    this.cubeGroup = new THREE.Group(); this.wrap.add(this.cubeGroup);
    this.cubies = buildCubies(this.cubeGroup);

    /* 拖动视角（默认 0：相机本身已在 3/4 视角，看到 U/F/R 三面） */
    let yaw = 0, pitch = 0, dragging = false, lx = 0, ly = 0;
    const dom = this.renderer.domElement;
    dom.style.touchAction = 'none';
    dom.addEventListener('pointerdown', (e) => { dragging = true; lx = e.clientX; ly = e.clientY; dom.setPointerCapture(e.pointerId); });
    dom.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      yaw -= (e.clientX - lx) * 0.008; pitch -= (e.clientY - ly) * 0.008;
      pitch = Math.max(-1.35, Math.min(1.35, pitch));
      lx = e.clientX; ly = e.clientY;
    });
    dom.addEventListener('pointerup', () => dragging = false);
    dom.addEventListener('pointercancel', () => dragging = false);
    this._orbit = () => { this.wrap.rotation.set(pitch, yaw, 0, 'YXZ'); };
    this.resetView = () => { yaw = 0; pitch = 0; };

    this.queue = []; this.animating = false; this.state = null; this.onDone = null;
    this._dead = false;
    const loop = () => {
      if (this._dead) return;
      this._orbit();
      this.renderer.render(this.scene, this.camera);
      requestAnimationFrame(loop);
    };
    loop();
  }
  setState(st) { this.state = st; this.paint(); }
  paint() { paintCubies(this.cubies, this.state); }
  play(algStr, onDone) { this.queue = parseAlg(algStr).slice(); this.onDone = onDone || null; this.pump(); }
  pause() { this.queue = []; this.onDone = null; }
  stepToken(tok, onDone) { this.queue = [tok]; this.onDone = onDone || null; this.pump(); }
  pump() {
    if (this.animating) return;
    const tok = this.queue.shift();
    if (!tok) { if (this.onDone) { const f = this.onDone; this.onDone = null; f(); } return; }
    const mv = MOVES[tok.replace(/['2]/g, '')];
    const sel = this.cubies.filter(({ mesh }) => {
      const p = mesh.position;
      return mv.test([Math.round(p.x), Math.round(p.y), Math.round(p.z)]);
    });
    const turns = tok.endsWith('2') ? 2 : tok.endsWith("'") ? 3 : 1;
    const total = mv.sign * turns * Math.PI / 2;   // 面转顺时针 = 绕正轴负方向
    const axis = { x: new THREE.Vector3(1,0,0), y: new THREE.Vector3(0,1,0), z: new THREE.Vector3(0,0,1) }[mv.axis];
    this.animating = true;
    const pivot = new THREE.Group(); this.cubeGroup.add(pivot);
    for (const { mesh } of sel) pivot.attach(mesh);
    const t0 = performance.now(), dur = this.speed;
    const tick = (now) => {
      const k = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);          // easeOutCubic
      pivot.setRotationFromAxisAngle(axis, total * e);
      if (k < 1) { requestAnimationFrame(tick); return; }
      for (const { mesh } of sel) { this.cubeGroup.attach(mesh); this.snapMesh(mesh); }
      pivot.removeFromParent();
      this.state = applyMove(this.state, tok);   // 引擎同步推进一格
      this.paint();
      this.animating = false;
      this.pump();
    };
    requestAnimationFrame(tick);
  }
  snapMesh(mesh) {
    mesh.position.set(Math.round(mesh.position.x), Math.round(mesh.position.y), Math.round(mesh.position.z));
    const m = new THREE.Matrix4().makeRotationFromQuaternion(mesh.quaternion);
    const el = m.elements;
    for (let i = 0; i < 16; i++) el[i] = Math.round(el[i]);
    mesh.quaternion.setFromRotationMatrix(m);
  }
  dispose() { this._dead = true; this.renderer.dispose(); this.renderer.domElement.remove(); }
}

/* ---------- 3D 查看器浮层 ---------- */
let viewerEl = null, viewerCube = null, viewerItem = null, viewerBase = null, viewerStepI = 0;

function openViewer(item, autoplay = false, stepFirst = false) {
  if (!viewerEl) {
    viewerEl = document.createElement('div');
    viewerEl.className = 'viewer';
    viewerEl.style.display = 'none';
    viewerEl.innerHTML = `<div class="viewer-panel">
      <div class="viewer-title"></div>
      <div class="viewer-alg"></div>
      <div class="viewer-stage"></div>
      <div class="viewer-ctrls">
        <button class="btn play" data-a="play">▶ 播放公式</button>
        <button class="btn" data-a="pause">⏸ 暂停</button>
        <button class="btn" data-a="step">单步 ▸</button>
        <button class="btn" data-a="reset">↺ 复位</button>
        <select data-a="speed"><option value="420">慢速</option><option value="260" selected>中速</option><option value="130">快速</option></select>
        <button class="btn" data-a="close">✕ 关闭</button>
      </div>
      <div class="viewer-hint">拖动魔方可旋转视角 · Esc 关闭</div>
    </div>`;
    document.body.appendChild(viewerEl);
    viewerCube = new Cube3D(viewerEl.querySelector('.viewer-stage'), { size: 400 });
    viewerEl.addEventListener('click', (e) => {
      const t = e.target.closest('[data-a]');
      if (e.target === viewerEl) { closeViewer(); return; }
      if (!t) return;
      const a = t.dataset.a;
      if (a === 'close') closeViewer();
      else if (a === 'play') { viewerCube.setState(viewerBase); viewerStepI = 0; viewerCube.play(viewerItem.alg); }
      else if (a === 'pause') viewerCube.pause();
      else if (a === 'step') stepViewer();
      else if (a === 'reset') { viewerCube.setState(viewerBase); viewerStepI = 0; }
      else if (a === 'speed') viewerCube.speed = +t.value;
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && viewerEl && viewerEl.style.display !== 'none') closeViewer(); });
  }
  viewerItem = item;
  viewerBase = rotateIfNeeded(caseFromAlg(item.alg));
  viewerStepI = 0;
  viewerEl.querySelector('.viewer-title').textContent = `${item.id} · ${item.name}`;
  viewerEl.querySelector('.viewer-alg').textContent = parseAlg(item.alg).join(' ');
  viewerEl.style.display = 'flex';
  viewerCube.setState(viewerBase);
  if (autoplay) viewerCube.play(item.alg);
  else if (stepFirst) stepViewer();
}

function stepViewer() {
  const toks = parseAlg(viewerItem.alg);
  if (viewerStepI >= toks.length) { viewerCube.setState(viewerBase); viewerStepI = 0; return; }
  viewerCube.stepToken(toks[viewerStepI]);
  viewerStepI++;
}

function closeViewer() { if (viewerCube) viewerCube.pause(); if (viewerEl) viewerEl.style.display = 'none'; }

/* ---------- 练习模式 3D 控件 ---------- */
document.getElementById('pPlay').onclick = () => {
  const it = practiceQueue[practiceIdx];
  if (!practiceCube || !it) return;
  practiceCube.setState(rotateIfNeeded(caseFromAlg(it.alg)));
  practiceCube.play(it.alg);
};
document.getElementById('pReset').onclick = () => {
  const it = practiceQueue[practiceIdx];
  if (!practiceCube || !it) return;
  practiceCube.setState(rotateIfNeeded(caseFromAlg(it.alg)));
  document.getElementById('pTitle').textContent = `第 ${practiceIdx + 1} / ${practiceQueue.length} 题 · 正确 ${practiceScore}`;
};
</script>
